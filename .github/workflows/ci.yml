name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default: the repository's default token is read-write,
# so every job starts read-only and a job that needs more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build binaries
        # docket-mcp's tests spawn the real docket-core binary; `cargo test`
        # alone only builds test-harness executables, not plain `cargo run`
        # binaries, so it won't produce docket-core.exe on its own.
        run: cargo build --workspace --bins

      - name: Test
        run: cargo test --workspace

      - name: Test the install script
        # Runs scripts/install.sh against a fake curl and uname. It pins that a
        # re-run replaces the installed launchers instead of rewriting them in
        # place, which macOS punishes with "Code Signature Invalid".
        run: bash scripts/test-install.sh

      - name: Check relative documentation links
        # rustdoc validates intra-doc links but never relative *file* links,
        # and nothing validates them inside docs/ — five ADR links shipped at
        # the wrong directory depth before this step existed.
        run: bash .github/scripts/check-doc-links.sh

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  # Releases ship Windows, Linux and macOS binaries (see release.yml), but the
  # `test` job above only ever runs on Linux. This job builds and tests on the
  # other two so a path, process or filesystem difference fails here instead of
  # in a published binary. Formatting, clippy, docs and link checks are
  # platform-independent and stay in `test`.
  test-platforms:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build binaries
        # Same reason as in `test`: docket-mcp's tests spawn the real
        # docket-core binary, which `cargo test` alone does not build.
        run: cargo build --workspace --bins

      - name: Test
        run: cargo test --workspace

      - name: Test the install script
        # macOS is the platform whose code-signature cache makes an in-place
        # overwrite of an installed launcher fatal, and its BSD userland
        # (mktemp, mv, ls) is what the script has to work with there.
        if: runner.os == 'macOS'
        run: bash scripts/test-install.sh

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      - name: Test
        working-directory: console
        run: npm test

      - name: Build
        working-directory: console
        run: npm run build
