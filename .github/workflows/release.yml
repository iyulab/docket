name: Release

on:
  push:
    tags:
      - "v*"
  # A tag pushed by another workflow's GITHUB_TOKEN (auto-tag.yml, in
  # particular) doesn't fire the `push: tags:` trigger above — GitHub
  # doesn't chain workflow runs off GITHUB_TOKEN-authored events, to avoid
  # accidental recursion. auto-tag.yml compensates by dispatching this
  # workflow directly for the tag it just pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.3.1) — must already exist"
        required: true

# Least privilege by default: the repository's default token is read-write,
# so every job starts read-only and a job that needs more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build docket-core, docket-mcp, docket-cc, and their launchers
        run: |
          cargo build --release -p docket-core --target ${{ matrix.target }}
          cargo build --release -p docket-mcp --target ${{ matrix.target }}
          cargo build --release -p docket-cc --target ${{ matrix.target }}
          cargo build --release -p docket-mcp-launcher --target ${{ matrix.target }}
          cargo build --release -p docket-cc-launcher --target ${{ matrix.target }}

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          for bin in docket-core docket-mcp docket-cc docket-mcp-launcher docket-cc-launcher; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" \
               "dist/${bin}-${{ matrix.target }}${{ matrix.ext }}"
          done

      - uses: actions/upload-artifact@v7 # v7 is not in delete-artifact@v6's compatibility table
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  build-windows:
    # Builds without any signing credential: `cargo build` runs every
    # dependency's build script and proc-macro, so the job that compiles must
    # not also hold the OIDC token that unlocks the code-signing certificate.
    # Signing happens in `sign-windows`, which runs nothing from this repo.
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Add target
        run: rustup target add ${{ env.target }}

      - name: Build docket-core, docket-mcp, docket-cc, and their launchers
        run: |
          cargo build --release -p docket-core --target ${{ env.target }}
          cargo build --release -p docket-mcp --target ${{ env.target }}
          cargo build --release -p docket-cc --target ${{ env.target }}
          cargo build --release -p docket-mcp-launcher --target ${{ env.target }}
          cargo build --release -p docket-cc-launcher --target ${{ env.target }}

      # Staged under their release names, so the signed artifact is already
      # in the shape `release` publishes. The folder must hold exactly the
      # files `sign-windows` lists — the signing workflow refuses anything else.
      - name: Stage files to sign
        shell: bash
        run: |
          mkdir -p to-sign
          for bin in docket-core docket-mcp docket-cc docket-mcp-launcher docket-cc-launcher; do
            cp "target/${{ env.target }}/release/${bin}.exe"                "to-sign/${bin}-${{ env.target }}.exe"
          done

      - uses: actions/upload-artifact@v7 # v7 is not in delete-artifact@v6's compatibility table
        with:
          name: unsigned-x86_64-pc-windows-msvc # not dist-*: must never reach the Release
          path: to-sign/*
          retention-days: 1

  sign-windows:
    # code-sign's reusable workflow: downloads the artifact, rejects it unless
    # it holds exactly these files, signs and verifies them, and uploads the
    # signed copies. Pinning the workflow pins the action it runs as well.
    needs: build-windows
    uses: iyulab/code-sign/.github/workflows/sign.yml@c4c68c25295ce0010a396d54cdb017fd248c5cce # main @ 2026-10-17
    permissions:
      id-token: write
      contents: read
    with:
      artifact: unsigned-x86_64-pc-windows-msvc
      files: |
        docket-core-x86_64-pc-windows-msvc.exe
        docket-mcp-x86_64-pc-windows-msvc.exe
        docket-cc-x86_64-pc-windows-msvc.exe
        docket-mcp-launcher-x86_64-pc-windows-msvc.exe
        docket-cc-launcher-x86_64-pc-windows-msvc.exe
      signed-artifact: dist-x86_64-pc-windows-msvc
      description: docket

  build-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build docket-console
        run: |
          npm --prefix console ci
          npm --prefix console run build

      - name: Zip console/dist
        run: |
          mkdir -p dist
          (cd console/dist && zip -r ../../dist/console-dist.zip .)

      - uses: actions/upload-artifact@v7 # v7 is not in delete-artifact@v6's compatibility table
        with:
          name: dist-console
          path: dist/*
          retention-days: 1

  # Gates publication, not the builds. v0.24.0 was cut four minutes after the
  # audit workflow went red on the same lockfile, because nothing connected the
  # two - its binaries shipped linking a vulnerable dependency and had to be
  # superseded within the hour. This re-runs the check against the tagged ref so
  # a release cannot be published over a live advisory.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit

  release:
    needs: [build, sign-windows, build-console, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # delete the intermediate dist-* artifacts below
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          # A `push: tags:` run has a tag as `github.ref_name` for free: the
          # action defaults to it. A `workflow_dispatch` run doesn't — its
          # ref is whatever branch was passed to `--ref` (main, here), so
          # the tag has to come from the dispatch input instead.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

      # The dist-* and unsigned-* artifacts only carry files between jobs; once they are
      # attached to the Release they are dead weight. Deleted on success only:
      # after a failure they are what "Re-run failed jobs" needs, and
      # retention-days: 1 already bounds how long they linger. A failed
      # cleanup must not mark an already-published release as failed.
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            dist-*
            unsigned-*
          failOnError: false
