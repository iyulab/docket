name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build docket-mcp and docket-mcp-launcher
        run: |
          cargo build --release -p docket-mcp --target ${{ matrix.target }}
          cargo build --release -p docket-mcp-launcher --target ${{ matrix.target }}

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/docket-mcp${{ matrix.ext }}" \
             "dist/docket-mcp-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/docket-mcp-launcher${{ matrix.ext }}" \
             "dist/docket-mcp-launcher-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
