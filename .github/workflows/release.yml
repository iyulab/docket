name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build docket-core, docket-mcp, docket-cc, and their launchers
        run: |
          cargo build --release -p docket-core --target ${{ matrix.target }}
          cargo build --release -p docket-mcp --target ${{ matrix.target }}
          cargo build --release -p docket-cc --target ${{ matrix.target }}
          cargo build --release -p docket-mcp-launcher --target ${{ matrix.target }}
          cargo build --release -p docket-cc-launcher --target ${{ matrix.target }}

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          for bin in docket-core docket-mcp docket-cc docket-mcp-launcher docket-cc-launcher; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" \
               "dist/${bin}-${{ matrix.target }}${{ matrix.ext }}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  build-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build docket-console
        run: |
          npm --prefix console ci
          npm --prefix console run build

      - name: Zip console/dist
        run: |
          mkdir -p dist
          (cd console/dist && zip -r ../../dist/console-dist.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-console
          path: dist/*
          retention-days: 1

  release:
    needs: [build, build-console]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
