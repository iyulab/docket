name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "console/package.json"
      - "console/package-lock.json"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "console/package.json"
      - "console/package-lock.json"
      - ".github/workflows/audit.yml"
  schedule:
    # Catch newly-published advisories against already-pinned dependencies,
    # not just dependency changes — for both ecosystems this repo uses.
    - cron: "0 0 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-audit is run directly rather than through rustsec/audit-check.
      # That action only fails the job on push and pull_request; on `schedule`
      # it opens an issue and exits green, which inverts the intent of the cron
      # above - the one trigger meant to catch advisories against an unchanged
      # lockfile was the one that could not turn red. It also reports only once,
      # deduplicating against the issue it already opened, and never closes it.
      # Running the tool directly exits non-zero on every trigger, so a
      # scheduled failure surfaces the way any other failing workflow does.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # An advisory with no patched release yet is waived in .cargo/audit.toml
      # (`[advisories] ignore = [...]`), not by weakening this step.
      - name: Audit
        run: cargo audit

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      - name: Audit
        working-directory: console
        run: npm audit
