name: Sign negative check (temporary)

# Temporary: expects the sign-in below to FAIL. A job that holds the
# production environment but does not run through the reusable signing
# workflow must not be able to obtain the signing credential.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct:
    runs-on: windows-latest
    timeout-minutes: 5
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      # No files given: the action only prepares the job, which includes the cloud sign-in.
      - uses: iyulab/code-sign@c4c68c25295ce0010a396d54cdb017fd248c5cce # main @ 2026-10-17
