[package]
name = "docket-mcp"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["json", "query"] }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
